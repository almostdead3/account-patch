name: Account.apk patch (force OnePlus H login mode)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest release)"
        required: false
        default: ""
      asset:
        description: "APK name in the release assets"
        required: true
        default: "Account.apk"

permissions:
  contents: read

env:
  APKTOOL_VERSION: "2.9.3"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ASSET: ${{ inputs.asset }}
  TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK from this repo's release
        run: |
          mkdir -p work
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "${{ github.repository }}" -p "$ASSET" -D work --clobber
          else
            gh release download -R "${{ github.repository }}" -p "$ASSET" -D work --clobber
          fi
          ls -lh work

      - name: Install apktool
        run: |
          curl -fL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '#!/bin/sh\nexec java -Xmx3g -jar "%s/apktool.jar" "$@"\n' "$PWD" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Install zipalign
        run: |
          if ! command -v zipalign >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zipalign
          fi
          command -v zipalign

      - name: Decompile code only (no resources)
        run: |
          cd work
          apktool d -r -f "$ASSET" -o src_nores
          ls src_nores

      - name: Patch util/c.a(Context) to always return true
        run: |
          F=$(find work/src_nores -path '*com/oneplus/account/util/c.smali' | head -n 1)
          echo "Patching: $F"
          python3 - "$F" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "FORCED_ONEPLUS_H" in s:
              sys.exit("already patched")
          pat = re.compile(
              r'\.method public static a\(Landroid/content/Context;\)Z\n.*?\.end method\n', re.S)
          m = list(pat.finditer(s))
          if len(m) != 1:
              sys.exit("method found %d times (expected 1); not patched" % len(m))
          new = (
              '.method public static a(Landroid/content/Context;)Z\n'
              '    .locals 1\n'
              '\n'
              '    # FORCED_ONEPLUS_H: behave like custFlag == 3\n'
              '    const/4 p0, 0x1\n'
              '\n'
              '    return p0\n'
              '.end method\n')
          s = s[:m[0].start()] + new + s[m[0].end():]
          open(p, "w", encoding="utf-8").write(s)
          print("patched", p)
          PY
          grep -n -B2 -A6 "FORCED_ONEPLUS_H" "$F"
          # which dex holds this class? smali/ = classes.dex, smali_classesN/ = classesN.dex
          DEX=classes.dex
          case "$F" in
            */smali_classes*/*)
              N=$(echo "$F" | sed -E 's|.*/smali_classes([0-9]+)/.*|\1|')
              DEX="classes${N}.dex"
              ;;
          esac
          echo "Patched class lives in: $DEX"
          echo "PATCHED_DEX=$DEX" >> "$GITHUB_ENV"

      - name: Rebuild patched APK (original APK + replaced dex only)
        run: |
          cd work
          # 1. build with apktool only to get a freshly compiled dex
          apktool b src_nores -o patched.apk
          mkdir -p dexout
          unzip -o -q patched.apk "$PATCHED_DEX" -d dexout
          ls -l dexout

          # 2. put that single dex into a copy of the ORIGINAL apk
          #    (META-INF, resources.arsc, manifest and the rest stay untouched)
          cp "$ASSET" base.apk
          (cd dexout && zip ../base.apk "$PATCHED_DEX")

          # 3. align
          mkdir -p out
          zipalign -p -f 4 base.apk out/Account.apk
          unzip -tq out/Account.apk

          echo "---- original vs patched ----"
          unzip -v "$ASSET" | grep -E "classes[0-9]*\.dex|resources\.arsc|AndroidManifest\.xml|META-INF/CERT|MANIFEST\.MF"
          echo "-----"
          unzip -v out/Account.apk | grep -E "classes[0-9]*\.dex|resources\.arsc|AndroidManifest\.xml|META-INF/CERT|MANIFEST\.MF"

          cd out
          zip -9 ../../Account-patched.zip Account.apk
          cd ../..
          ls -lh Account-patched.zip

      - name: Upload patched artifact
        uses: actions/upload-artifact@v4
        with:
          name: Account-patched
          path: Account-patched.zip
          if-no-files-found: error
